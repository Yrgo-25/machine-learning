# Set pipeline name.
name: CI

# Set pipeline triggers.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Define pipeline jobs.
jobs:
  # Build practice exam code, run on latest Ubuntu runner.
  build-practice_exam:
    name: Build practice exam code
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build
        run: make build

  # Check code formatting. The Ubuntu image and the clang-format version are both pinned, since
  # different clang-format versions format the same code differently.
  format-check:
    name: Check formatting
    runs-on: ubuntu-24.04
    env:
      CLANG_FORMAT: clang-format-18
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install black
        run: pip install -r requirements.txt
      - name: Check formatting
        run: make format-check